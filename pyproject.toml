[project]
name = "why-test-cases"
version = "0.1.0"
description = "The Bug Zoo - a live demo of why we write test cases"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pytest>=8",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "--import-mode=importlib"
